name: LauronFlow
options:
  bundleIdPrefix: com.lauronjohn
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "LauronFlow Local Dev"
    ENABLE_HARDENED_RUNTIME: NO
targets:
  LauronFlow:
    type: application
    platform: macOS
    sources:
      - path: LauronFlow
    info:
      path: LauronFlow/Info.plist
      properties:
        LSUIElement: YES
        NSMicrophoneUsageDescription: "LauronFlow needs microphone access to transcribe your speech."
    entitlements:
      path: LauronFlow/LauronFlow.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lauronjohn.LauronFlow
        PRODUCT_NAME: LauronFlow
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
